
services:
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    privileged: true
    environment:
      PISTON_DISABLE_NETWORKING: "true"
      PISTON_MAX_PROCESS_COUNT: "32"
      PISTON_OUTPUT_MAX_SIZE: "20000"
      PISTON_MAX_OPEN_FILES: "32"
      PISTON_MAX_FILE_SIZE: "1000000"
      PISTON_COMPILE_TIMEOUT: "10000"
      PISTON_RUN_TIMEOUT: "5000"
      PISTON_COMPILE_CPU_TIME: "10000"
      PISTON_RUN_CPU_TIME: "5000"
      PISTON_COMPILE_MEMORY_LIMIT: "268435456"
      PISTON_RUN_MEMORY_LIMIT: "134217728"
      PISTON_MAX_CONCURRENT_JOBS: "4"
    ports:
      - "127.0.0.1:2000:2000"
    volumes:
      - piston_packages:/piston/packages
    tmpfs:
      - /tmp:exec,size=512m
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "require('http').get('http://127.0.0.1:2000/api/v2/runtimes',
          r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20

  piston-init:
    image: curlimages/curl:8.11.1
    restart: "no"
    depends_on:
      piston:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        set -eu
        runtimes="$$(curl -fsS http://piston:2000/api/v2/runtimes)"

        if ! echo "$$runtimes" | grep -Eq '"language"[[:space:]]*:[[:space:]]*"python"'; then
          echo "Installing Python 3.12.0..."
          curl -fsS -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d '{"language":"python","version":"3.12.0"}'
        fi

        if ! echo "$$runtimes" | grep -Eq '"language"[[:space:]]*:[[:space:]]*"c"'; then
          echo "Installing GCC 10.2.0..."
          curl -fsS -X POST http://piston:2000/api/v2/packages \
            -H 'Content-Type: application/json' \
            -d '{"language":"gcc","version":"10.2.0"}'
        fi

        echo "Piston runtimes are ready."

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_ai}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen-max}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:5173}
      XFYUN_APP_ID: ${XFYUN_APP_ID:-}
      XFYUN_API_SECRET: ${XFYUN_API_SECRET:-}
      PISTON_API_URL: http://piston:2000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-study_ai}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-root}
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      piston-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mysql_data:
  piston_packages:
